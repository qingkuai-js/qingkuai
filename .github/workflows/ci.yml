name: CI

on:
  push:
    branches-ignore:
      - e2e-badge
    paths-ignore:
      - "badges/e2e-scenarios.json"
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run postinstall
        run: pnpm run postinstall

      - name: Run typecheck
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run typecheck

      - name: Run lint
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run lint

      - name: Run unit tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: compiler
          fail_ci_if_error: true

      - name: Build package
        run: pnpm run build

      - name: Strip install-time scripts
        run: pnpm exec tsx scripts/strip-install-scripts.ts

      - name: Pack npm tarball
        run: npm pack

      - name: Verify packed package
        run: pnpm exec tsx scripts/verify-package.ts

  # 浏览器端到端只在 Linux 上跑：全浏览器矩阵在 nightly 里覆盖
  # Browser E2E tests only run on Linux: the full browser matrix is covered in nightly
  e2e:
    name: E2E (chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run postinstall
        run: pnpm run postinstall

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build package
        run: pnpm run build

      - name: Run E2E tests (Chromium)
        run: pnpm exec playwright test --project=chromium-debug --project=chromium-non-debug
